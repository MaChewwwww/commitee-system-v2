# Example Apache SetEnv for XAMPP (DO NOT commit real keys)
# Copy the SetEnv lines into:
#   C:\xampp\apache\conf\extra\httpd-xampp.conf
# inside the existing <IfModule env_module> ... </IfModule> block.
# Then restart Apache from the XAMPP Control Panel.
#
# SetEnv GEMINI_API_KEY "YOUR_KEY_HERE"
#   OR
# SetEnv COMMITTEE_GEMINI_API_KEY "YOUR_KEY_HERE"
#
# Verify (while logged in) via:
#   GET /committee-management/backend/api/ai/status.php
# Expect: "config_status":"CONFIGURED"
